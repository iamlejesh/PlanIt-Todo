
<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>
</head>
<body>

    <h2>Edit Task</h2>

    <form method="POST">
        {% csrf_token %}

        <input
            type="text"
            name="title"
            value="{{ task.title }}"
            required
        >
        <br><br>

        <textarea name="description">{{ task.description }}</textarea>
        <br><br>

        <label>Priority:</label>

        <select name="priority">
            <option value="Low" {% if task.priority == "Low" %}selected{% endif %}>Low</option>

            <option value="Medium" {% if task.priority == "Medium" %}selected{% endif %}>Medium</option>

            <option value="High" {% if task.priority == "High" %}selected{% endif %}>High</option>
        </select>
        <br><br>

        <label>Category:</label>

        <select name="category">
            <option value="Work" {% if task.category == 'Work' %}selected{% endif %}>Work</option>
            <option value="Personal" {% if task.category == 'Personal' %}selected{% endif %}>Personal</option>
            <option value="Study" {% if task.category == 'Study' %}selected{% endif %}>Study</option>
            <option value="Shopping" {% if task.category == 'Shopping' %}selected{% endif %}>Shopping</option>
            <option value="Other" {% if task.category == 'Other' %}selected{% endif %}>Other</option>
        </select>
        <br><br>

        <label>Due Date:</label>

        <input
            type="datetime-local"
            name="due_date"
            value="{{ task.due_date|date:'Y-m-d\TH:i' }}"
        >
        <br><br>

        <button type="submit">Update Task</button>
    </form>

    <br>

    <a href="{% url 'dashboard' %}">Back to Dashboard</a>

</body>
</html>
