
<!DOCTYPE html>
<html>
<head>
    <title>Notifications - PlanIt-Todo</title>
</head>
<body>

    <h2>Notifications</h2>

    <a href="{% url 'dashboard' %}">Back to Dashboard</a>

    <hr>

    {% for notification in notifications %}

        <div style="border: 1px solid #ccc; padding: 12px; margin-bottom: 10px;">

            <p>
                {{ notification.message }}
            </p>

            <small>
                {{ notification.created_at }}
            </small>

            {% if notification.is_read %}
                <p>Read</p>
            {% else %}
                <p>Unread</p>

                <form method="POST" action="{% url 'mark_notification_read' notification.id %}">
                    {% csrf_token %}
                    <button type="submit">Mark as Read</button>
                </form>
            {% endif %}

            <form method="POST" action="{% url 'delete_notification' notification.id %}">
                {% csrf_token %}
                <button type="submit">Delete</button>
            </form>

        </div>

    {% empty %}

        <p>No notifications available.</p>

    {% endfor %}

</body>
</html>
