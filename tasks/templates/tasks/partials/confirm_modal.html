{% load planit_ui %}
<dialog class="modal modal-sm" id="confirm-modal" role="alertdialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <div class="confirm-body">
        <span class="confirm-icon">{% icon 'trash' 20 %}</span>
        <h2 class="confirm-title" id="confirm-title">Are you sure?</h2>
        <p class="confirm-message" id="confirm-message">This action can't be undone.</p>
    </div>
    <div class="confirm-actions">
        <button type="button" class="btn btn-secondary" data-modal-close>Cancel</button>
        <button type="button" class="btn btn-danger" data-confirm-accept><span data-confirm-label>Delete</span></button>
    </div>
</dialog>
